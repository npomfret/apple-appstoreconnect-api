# Written by agent-standards/sync.py. Local edits are reverted by the next
# `sync.py apply`; the project's own lever is .codex/rules/project.rules.
approval_policy = "on-request"
default_permissions = "project"

[permissions.project]
description = "Write inside the checkout; read anywhere; reach the network."
extends = ":workspace"

[permissions.project.filesystem]
"~/.npm" = "write"
"~/.cache" = "write"
"~/Library/Caches" = "write"
"~/Library/pnpm" = "write"
"~/Library/Developer/Xcode/DerivedData" = "write"
"~/.gitnexus" = "write"
"~/.docker/buildx" = "write"

[permissions.project.network]
enabled = true

[mcp_servers.gitnexus]
command = "npx"
args = ["gitnexus", "mcp"]

[mcp_servers.webstorm]
url = "http://127.0.0.1:64542/stream"
env_http_headers = { IJ_MCP_SERVER_PROJECT_PATH = "PWD" }
disabled_tools = ["execute_terminal_command", "execute_run_configuration", "execute_tool", "run_inspection_kts", "build_project", "apply_patch", "create_new_file", "reformat_file"]
